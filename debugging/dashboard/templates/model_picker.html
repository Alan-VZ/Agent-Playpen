<style>
.pp-model-dialog{color-scheme:dark;background:#142031;color:#e5edf7;border:1px solid #53667e;border-radius:10px;width:min(720px,90vw);max-height:80vh;padding:22px;font:15px/1.5 system-ui}.pp-model-dialog::backdrop{background:#0009}.pp-model-dialog header{display:flex;justify-content:space-between;align-items:center}.pp-model-dialog input{box-sizing:border-box;width:100%;padding:10px;background:#0c1522;color:#e5edf7;border:1px solid #53667e;border-radius:5px;margin:12px 0}.pp-model-dialog button,.pp-model-choose{font:inherit;padding:9px 12px;background:#253b56;color:#e5edf7;border:1px solid #53667e;border-radius:5px;cursor:pointer}.pp-model-options{max-height:42vh;overflow:auto;display:grid;gap:7px}.pp-model-options button{text-align:left;overflow-wrap:anywhere}.pp-model-status{font-size:13px;color:#b6cce5;white-space:pre-wrap}.pp-model-dialog :focus-visible{outline:2px solid #9fccff;outline-offset:3px}
</style>
<script nonce="{{ session_token }}">
(() => {
 const token={{ session_token | tojson }},instances=new Set(),pending=new Map();
 async function api(path,body){const options={headers:{'X-Playpen-Token':token}};if(body!==undefined){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}const response=await fetch(path,options),data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:data.message||'Model selection failed.');return data;}
 function catalog(backend,base_url){const key=JSON.stringify([backend,base_url||'']);if(!pending.has(key)){const p=api('/api/model-picker?'+new URLSearchParams({backend,base_url:base_url||''})).then(data=>{if(data.source==='unavailable')pending.delete(key);return data;}).catch(error=>{pending.delete(key);throw error;});pending.set(key,p);}return pending.get(key);}

 function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e;}
 function mount(parent,options){
  const field=options.field||document.createElement('input'),button=options.button||text('button','Choose model'),status=options.status||text('p','');
  field.readOnly=true;field.placeholder='No model selected';button.type='button';button.textContent='Choose model';button.classList.add('pp-model-choose');status.classList.add('pp-model-status');status.setAttribute('role','status');
  if(!options.field){const label=text('label','Model');label.append(field);parent.append(label);}if(!options.button)parent.append(button);if(!options.status)parent.append(status);
  const dialog=document.createElement('dialog');dialog.className='pp-model-dialog';const title=text('h2','Choose model'),close=text('button','Close');close.type='button';const header=document.createElement('header');header.append(title,close);
  const search=document.createElement('input');search.placeholder='Search available models';search.setAttribute('aria-label','Search available models');const note=text('p',''),list=document.createElement('div');list.className='pp-model-options';
  const manual=document.createElement('details'),manualTitle=text('summary','Enter a model or deployment ID'),manualInput=document.createElement('input'),use=text('button','Choose model');manualInput.setAttribute('aria-label','Model or deployment ID');use.type='button';manual.append(manualTitle,manualInput,use);dialog.append(header,search,note,list,manual);document.body.append(dialog);
  let busy=false,sequence=0,items=[];
  const context=()=>JSON.stringify([options.backend(),options.baseUrl()||'']);
  const assigned=()=>options.model()||'';
  function update(value){field.value=value;options.selected(value);}
  function follow(){return typeof options.followActive==='function'?options.followActive():options.followActive!==false;}
  async function refresh(){const version=++sequence,backend=options.backend();if(!backend)return;if(!['lm_studio','ollama'].includes(backend)){field.value=assigned()==='local-model'?'':assigned();status.textContent=field.value?'Selected':'Choose a model';return;}
   const snapshot=context();status.textContent='Checking active model…';try{const data=await catalog(backend,options.baseUrl());if(version!==sequence||snapshot!==context()||!parent.isConnected)return;if(options.catalog)options.catalog(data);const active=data.active_models||[];if(follow()||!assigned()||assigned()==='local-model'){const current=active.includes(assigned())?assigned():active[0]||'';update(current);}else field.value=assigned();status.textContent=data.message|| (active.includes(field.value)?'Active':field.value?'Selected · prepared when this slot runs':'No model loaded');}catch(e){if(version===sequence)status.textContent=e.message;}}
  async function choose(id){if(busy||!id.trim())return;const snapshot=context();busy=true;button.disabled=true;use.disabled=true;note.textContent=status.textContent='Preparing '+id+'…';try{const result=await api('/api/model-picker',{backend:options.backend(),model:id.trim(),base_url:options.baseUrl()||null});if(snapshot!==context())return;update(result.model);status.textContent=result.loaded?'Active':'Selected';dialog.close();if(result.loaded){const cached=await pending.get(snapshot);if(cached)pending.set(snapshot,Promise.resolve({...cached,active_models:[result.model],models:cached.models.map(m=>({...m,loaded:m.id===id.trim()||m.id===result.model,instances:m.id===id.trim()||m.id===result.model?[result.model]:[]}))}));}for(const other of instances)if(other!==control&&other.parent.isConnected)other.refresh();}catch(e){note.textContent=status.textContent=e.message;}finally{busy=false;button.disabled=false;use.disabled=false;}}
  function render(){const query=search.value.toLowerCase();list.replaceChildren();for(const item of items.filter(m=>m.id.toLowerCase().includes(query))){const choice=text('button',item.id+(item.loaded?' · Active':''));choice.type='button';choice.addEventListener('click',()=>choose(item.id));list.append(choice);}if(!list.children.length)list.append(text('p','No matching models.'));}
  async function open(){if(busy)return;search.value='';manualInput.value='';note.textContent='Finding available models…';list.replaceChildren();title.textContent='Choose model · '+options.backend();dialog.showModal();const snapshot=context();try{const data=await catalog(options.backend(),options.baseUrl());if(snapshot!==context()){dialog.close();return;}items=data.models||[];if(options.catalog)options.catalog(data);note.textContent=data.message||'Select a model to use it.';render();search.focus();}catch(e){note.textContent=e.message;}}
  close.addEventListener('click',()=>dialog.close());search.addEventListener('input',render);use.addEventListener('click',()=>choose(manualInput.value));button.addEventListener('click',open);
  const control={parent,refresh,open,dispose:()=>{instances.delete(control);dialog.remove();}};instances.add(control);refresh();return control;
 }
 window.playpenModelPicker={mount,prune:()=>{for(const item of instances)if(!item.parent.isConnected)item.dispose();},refreshAll:()=>{for(const item of instances){if(item.parent.isConnected)item.refresh();else item.dispose();}}};
})();
</script>
