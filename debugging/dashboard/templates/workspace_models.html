<style>
.workspace-model-card{border:1px solid #53667e;border-radius:8px;padding:16px;margin:12px 0;background:#131d2b;min-width:0}.workspace-model-card h3{margin:0 0 14px}.workspace-model-card .field{margin-bottom:14px}.workspace-model-card input,.workspace-model-card select{box-sizing:border-box;width:100%;min-width:0}.workspace-model-card label{display:block;margin:9px 0 5px}.workspace-model-card .slot-tools label{display:flex;gap:8px;align-items:center}.workspace-model-card .slot-tools input{width:auto}.workspace-model-card button{margin-top:8px}.workspace-model-card .input-row{display:flex;flex-wrap:wrap;gap:8px}.workspace-model-card .input-row input{flex:1 1 180px}#workspace-extra-models{min-width:0}
</style>
<script nonce="{{ session_token }}">
(() => {
 const extra=[],controls=[];
 const el=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;return e;};
 function primary(){return {backend:document.getElementById('backend').value,model:document.getElementById('model').value,base_url:document.getElementById('base_url').value,role:'Independent researcher',planner:document.getElementById('planner').value,tool_calling_mode:document.getElementById('tool_calling_mode').value,temperature:Number(document.getElementById('temperature').value),max_tokens:Number(document.getElementById('max_tokens').value),max_iterations:Number(document.getElementById('max_iterations').value),allowed_dirs:document.getElementById('allowed_dirs').value,search_provider:document.getElementById('search_provider').value,tools:Array.from(document.querySelectorAll('input[name=tools]:checked')).map(i=>i.value)};}
 function get(){const count=Math.max(1,Math.min(10,Math.floor(Number(document.getElementById('workspace-model-count').value))||1));while(extra.length<count-1)extra.push({...primary(),tools:[...primary().tools],model:''});return [primary(),...extra.slice(0,count-1)].map(s=>({...s,tools:[...s.tools]}));}
 function render(){const root=document.getElementById('workspace-extra-models');if(!root)return;for(const c of controls)c.dispose();controls.length=0;root.replaceChildren();const count=get().length;
  for(let index=0;index<count-1;index++){const slot=extra[index],panel=el('section');panel.className='workspace-model-card';panel.dataset.slot=String(index+2);panel.append(el('h3','Model '+(index+2)));const remove=el('button','Remove model '+(index+2));remove.type='button';remove.addEventListener('click',()=>{extra.splice(index,1);document.getElementById('workspace-model-count').value=String(count-1);render();});panel.append(remove);root.append(panel);
   function input(label,key,type='text',min,max){const l=el('label',label),i=el('input');i.type=type==='number'?'text':type;if(type==='number')i.inputMode=key==='temperature'?'decimal':'numeric';i.value=slot[key]??'';i.dataset.parameter=key;i.setAttribute('aria-label','Model '+(index+2)+' '+label);if(min!==undefined)i.min=min;if(max!==undefined)i.max=max;if(type==='number')i.step=key==='temperature'?'any':'1';i.required=true;i.addEventListener('input',()=>{const value=Number(i.value);if(type==='number')i.setCustomValidity(i.value.trim()!==''&&Number.isFinite(value)&&value>=min&&value<=max&&(key==='temperature'||Number.isInteger(value))?'':'Enter a valid '+label+' from '+min+' to '+max+'.');slot[key]=type==='number'?value:i.value;});l.append(i);panel.append(l);return i;}
   function select(label,key,values){const l=el('label',label),s=el('select');s.dataset.parameter=key;s.setAttribute('aria-label','Model '+(index+2)+' '+label);for(const value of values){const o=el('option',value);o.value=value;s.append(o);}s.value=slot[key];s.addEventListener('change',()=>slot[key]=s.value);l.append(s);panel.append(l);return s;}
   const backend=select('Backend','backend',Array.from(document.getElementById('backend').options).map(o=>o.value));
   const holder=el('div');panel.append(holder);const chooser=window.playpenModelPicker.mount(holder,{backend:()=>slot.backend,model:()=>slot.model,baseUrl:()=>slot.base_url,followActive:false,selected:name=>slot.model=name});controls.push(chooser);
   const endpoint=input('Base URL','base_url');endpoint.required=false;endpoint.addEventListener('change',()=>chooser.refresh());
   backend.addEventListener('change',()=>{slot.model='';slot.base_url=slot.backend==='lm_studio'?'http://localhost:1234/v1':slot.backend==='ollama'?'http://localhost:11434/v1':'';endpoint.value=slot.base_url;chooser.refresh();});
   select('Planner','planner',['react','cot','tree']);select('Tool calling','tool_calling_mode',['auto','native','prompt']);
   input('Max iterations','max_iterations','number',1,50);input('Temperature','temperature','number',0,2);input('Max tokens','max_tokens','number',64,16384);
   input('Allowed directories','allowed_dirs');select('Web search provider','search_provider',Array.from(document.getElementById('search_provider').options).map(o=>o.value));
   const tools=el('div');tools.className='slot-tools';tools.append(el('strong','Tools'));for(const option of document.querySelectorAll('input[name=tools]')){const label=el('label'),box=el('input');box.type='checkbox';box.value=option.value;box.checked=slot.tools.includes(option.value);box.addEventListener('change',()=>{slot.tools=Array.from(tools.querySelectorAll('input:checked')).map(i=>i.value);});label.append(box,document.createTextNode(option.value));tools.append(label);}panel.append(tools);
   const note=el('p','Baseline tasks automatically use ReAct and the required baseline tools. Other parameters remain specific to this model.');note.className='field-note';panel.append(note);
  }
  window.playpenModelPicker.refreshAll();
 }
 function init(saved){const count=document.getElementById('workspace-model-count');const primaryCard=el('section');primaryCard.className='workspace-model-card';primaryCard.dataset.slot='1';primaryCard.append(el('h3','Model 1'));const first=document.getElementById('backend').closest('.field');const countField=el('div');countField.className='field';first.before(countField);countField.append(document.querySelector('label[for=workspace-model-count]'),count);const add=el('button','Add model');add.type='button';add.addEventListener('click',()=>{if(Number(count.value)>=10)return;count.value=String(Number(count.value)+1);render();});countField.append(add);first.before(primaryCard);for(const id of ['backend','model','base_url','planner','tool_calling_mode','tool-list','max_iterations','temperature','max_tokens','allowed_dirs','search_provider']){const node=document.getElementById(id)?.closest('.field');if(node&&!primaryCard.contains(node))primaryCard.append(node);}document.querySelector('label[for=backend]').textContent='Backend';
 if(Array.isArray(saved)&&saved.length){count.value=String(saved.length);for(const slot of saved.slice(1))extra.push({...primary(),...slot});}
 count.addEventListener('change',()=>{count.value=String(Math.max(1,Math.min(10,Math.floor(Number(count.value))||1)));render();});render();}
 window.playpenModelSlots={get,init};
})();
</script>
