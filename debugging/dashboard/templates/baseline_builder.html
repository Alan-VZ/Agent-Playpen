<style>.baseline-builder{border:1px solid #40536d;border-radius:8px;padding:18px;margin:14px 0}.baseline-builder .fields{display:flex;flex-wrap:wrap;gap:14px}.baseline-builder label{display:flex;flex-direction:column;gap:6px}.baseline-builder input{font:inherit;padding:9px;background:#131f30;color:#e4efff;border:1px solid #53667e;border-radius:5px;max-width:100%;box-sizing:border-box}.baseline-builder select{margin:0}.baseline-member{padding:14px;background:#162337;margin:12px 0;border-radius:6px}.baseline-member .model-input{min-width:240px}.baseline-builder h2{font-size:19px;margin-top:0}.baseline-builder label.checkbox-option{display:flex;flex-direction:row;align-items:center;gap:9px;width:auto;align-self:center;padding:8px 0}.baseline-builder input[type=checkbox]{width:17px;height:17px;max-width:17px;flex:0 0 17px;margin:0;padding:0;accent-color:#78b7ff}.baseline-builder .fields{align-items:end}.baseline-builder .baseline-tools{display:flex;flex-wrap:wrap;gap:14px;width:100%;border-top:1px solid #40536d;padding-top:8px;margin-top:8px}</style>
<div id="baseline-builder"></div><button id="baseline-add-config" type="button">Add comparison configuration</button>
{% include 'model_picker.html' %}
<script nonce="{{ session_token }}">
// Builders use the canonical non-secret JSON configuration so CLI and UI stay compatible.
window.installBaselineBuilder=function(input){
 const root=document.getElementById('baseline-builder');
 const backends=['lm_studio','ollama','openrouter','openai','anthropic','groq','together','azure_openai'];
 const element=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;return e;};
 function render(){let configs;try{configs=JSON.parse(input.value);}catch{return;}if(!Array.isArray(configs))return;root.replaceChildren();window.playpenModelPicker.prune();
  const save=()=>{input.value=JSON.stringify(configs,null,2);};
  function field(parent,label,value,change,type='text'){const l=element('label',label),i=document.createElement('input');i.type=type;i.value=value;i.addEventListener('change',()=>{change(type==='number'?Number(i.value):i.value);save();});l.append(i);parent.append(l);return i;}
  function select(parent,label,value,choices,change){const l=element('label',label),s=document.createElement('select');for(const option of choices){const o=element('option',({react:'ReAct',cot:'Chain of Thought',tree:'Tree of Thought'})[option]||option);o.value=option;s.append(o);}s.value=value;s.addEventListener('change',()=>{change(s.value);save();});l.append(s);parent.append(l);return s;}
  for(const [index,config] of configs.entries()){
   const automatic=config.auto_baseline_setup!==false;if(automatic){const setup=window.playpenBaselineTasks.setup(config.selected_tasks||window.playpenBaselineTasks.ids());for(const member of config.agents){member.planner=setup.planner;member.tools=[...setup.tools];}save();}
   const section=element('section');section.className='baseline-builder';section.append(element('h2','Configuration '+(index+1)));const autoLabel=element('label'),auto=document.createElement('input');auto.type='checkbox';auto.checked=automatic;auto.addEventListener('change',()=>{config.auto_baseline_setup=auto.checked;save();render();});autoLabel.className='checkbox-option';autoLabel.append(auto,document.createTextNode(' Automatically select the baseline planner and required tools'));section.append(autoLabel);
   const taskPanel=element('fieldset'),legend=element('legend','Tests for this configuration');taskPanel.append(legend);const sharedLabel=element('label'),shared=document.createElement('input');shared.type='checkbox';shared.checked=!config.selected_tasks;sharedLabel.className='checkbox-option';sharedLabel.append(shared,document.createTextNode('Use shared task selection'));taskPanel.append(sharedLabel);shared.addEventListener('change',()=>{if(shared.checked)delete config.selected_tasks;else config.selected_tasks=[...window.playpenBaselineTasks.ids()];save();render();});
   for(const id of ['B01','B02','B03','B04','B05']){const label=element('label'),box=document.createElement('input');box.type='checkbox';box.dataset.task=id;box.checked=(config.selected_tasks||window.playpenBaselineTasks.ids()).includes(id);box.disabled=shared.checked;label.className='checkbox-option';label.append(box,document.createTextNode(id));taskPanel.append(label);box.addEventListener('change',()=>{const selected=Array.from(taskPanel.querySelectorAll('input[data-task]:checked')).map(i=>i.dataset.task);if(!selected.length){box.checked=true;return;}config.selected_tasks=selected;save();render();});}section.append(taskPanel);
   const fields=element('div');fields.className='fields';section.append(fields);
   field(fields,'Name',config.name,v=>config.name=v);
   const count=field(fields,'Number of agents',config.agents.length,v=>{v=Math.max(1,Math.min(10,Math.floor(v)||1));while(config.agents.length<v)config.agents.push({...config.agents[0],role:'Independent researcher'});config.agents.length=v;if(v>1)config.agents[v-1].role='Critic and synthesizer: preserve evidence-backed dissent.';save();render();},'number');count.min='1';count.max='10';
   const concurrency=field(fields,'Maximum simultaneous agents',config.max_concurrency||1,v=>config.max_concurrency=v,'number');concurrency.min='1';concurrency.max='10';
   const seconds=field(fields,'Time limit per task (seconds)',config.timeout_seconds||210,v=>config.timeout_seconds=v,'number');seconds.min='1';seconds.max='1800';
   field(fields,'Maximum iterations',config.max_iterations||10,v=>config.max_iterations=v,'number');field(fields,'Max output tokens',config.max_output_tokens||2048,v=>config.max_output_tokens=v,'number');
   field(fields,'Shared token reservation limit',config.token_reservation_limit||300000,v=>config.token_reservation_limit=v,'number');field(fields,'Shared tool request limit',config.tool_request_limit||120,v=>config.tool_request_limit=v,'number');
   for(const [memberIndex,member] of config.agents.entries()){
    const panel=element('div');panel.className='baseline-member';panel.append(element('strong',config.agents.length>1&&memberIndex===config.agents.length-1?'Agent '+(memberIndex+1)+' · critic / synthesizer':'Agent '+(memberIndex+1)+' · independent researcher'));const row=element('div');row.className='fields';panel.append(row);
    select(row,'Model provider',member.backend,backends,v=>{member.backend=v;member.model='';member.base_url=v==='lm_studio'?'http://localhost:1234/v1':v==='ollama'?'http://localhost:11434/v1':null;save();render();});
    const model=field(row,'Model',member.model,v=>member.model=v);model.readOnly=true;model.className='model-input';
    select(row,'Planner',member.planner||'react',['react','cot','tree'],v=>member.planner=v).disabled=automatic;
    select(row,'Tool calling',member.tool_calling_mode||'prompt',['auto','native','prompt'],v=>member.tool_calling_mode=v);
    const temperature=field(row,'Temperature',member.temperature??0,v=>member.temperature=v,'number');temperature.min='0';temperature.max='2';temperature.step='any';
    const toolGroup=element('div');toolGroup.className='baseline-tools';row.append(toolGroup);const toolNames={read_fixture:'Read baseline inputs',calculator:'Calculator',write_artifact:'Write baseline report'};for(const [id,title] of Object.entries(toolNames)){const label=element('label'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=(member.tools||Object.keys(toolNames)).includes(id);checkbox.disabled=automatic;checkbox.addEventListener('change',()=>{const selected=new Set(member.tools||Object.keys(toolNames));if(checkbox.checked)selected.add(id);else selected.delete(id);member.tools=Array.from(selected);save();});label.className='checkbox-option';label.append(checkbox,document.createTextNode(title));toolGroup.append(label);}
    field(panel,'Role',member.role||'Independent researcher',v=>member.role=v);
    if(['lm_studio','ollama','azure_openai'].includes(member.backend))field(panel,member.backend==='azure_openai'?'Azure resource endpoint':'Local server URL (optional)',member.base_url||'',v=>member.base_url=v||null,'url');
    const picker=element('div');panel.append(picker);section.append(panel);window.playpenModelPicker.mount(picker,{field:model,backend:()=>member.backend,model:()=>member.model,baseUrl:()=>member.base_url,followActive:false,selected:id=>{member.model=id;model.value=id;save();}});

   }
   if(configs.length>1){const remove=element('button','Remove configuration');remove.type='button';remove.addEventListener('click',()=>{configs.splice(index,1);save();render();});section.append(remove);}root.append(section);
  }
 }
 document.getElementById('baseline-add-config').addEventListener('click',()=>{const configs=JSON.parse(input.value);if(configs.length>=10)return;const copy=JSON.parse(JSON.stringify(configs[0]));copy.name='comparison-'+(configs.length+1);configs.push(copy);input.value=JSON.stringify(configs,null,2);render();});input.addEventListener('change',render);document.addEventListener('baseline-tasks-changed',render);return render;
};
</script>
